schema: spec-driven

context: |
  Project: test-wizard
  Stack: React 19.2.8, Vite 8.2.0, Node.js (unspecified), npm 11
  Architecture: React app with AI Workflow Wizard protocols
  Testing layers: unit, integration, e2e

testing:
  strict_tdd: false
  test_runner: vitest+playwright
  test_command: npm test
  coverage_command: npm run test:coverage
  e2e_command: npm run test:e2e
  layers:
    unit: true
    integration: true
    e2e: true
  tools:
    linter: eslint
    linter_command: npm run lint
    type_checker: tsc
    type_checker_command: npx tsc --noEmit
    formatter: none

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: false
    test_command: npm test
  verify:
    test_command: npm test
    build_command: npm run build
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

checks_before_done:
  - npm run lint
  - npm run build
  - npm run test
  - npm run test:e2e
